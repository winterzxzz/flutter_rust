name: fast_rust
description: >-
  Rust-powered kernels for Flutter and Dart over zero-copy dart:ffi: path
  tracing, photo recoloring, photo to coloring page, flood fill, falling sand.
version: 0.3.0
homepage: https://github.com/winterzxzz/flutter_rust
repository: https://github.com/winterzxzz/flutter_rust/tree/main/packages/fast_rust
issue_tracker: https://github.com/winterzxzz/flutter_rust/issues
topics:
  - ffi
  - rust
  - performance
  - image-processing
  - native-assets

screenshots:
  - description: Real-time path tracing of glass and metal spheres in Flutter
    path: doc/screenshots/ray.png
  - description: Recoloring a real photo in Flutter with Rust, texture kept
    path: doc/screenshots/photo.png
  - description: A photo turned into a coloring page by Rust, then filled
    path: doc/screenshots/lineart.png
  - description: Color splash on a photo, gray except the tapped regions
    path: doc/screenshots/splash.png
  - description: Falling-sand simulation of a million cells
    path: doc/screenshots/sand.png
  - description: Pixel-art coloring book with a Rust flood fill
    path: doc/screenshots/paint.png
  - description: Mandelbrot explorer rendered by multi-threaded Rust
    path: doc/screenshots/fractal.png
  - description: Real-time box blur on the UI thread
    path: doc/screenshots/blur.png

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.2.0

dev_dependencies:
  crypto: ^3.0.6
  lints: ^6.0.0
  test: ^1.25.0
