name: fast_rust
description: >-
  Rust-powered image and data kernels for Flutter and Dart over zero-copy
  dart:ffi: photo recoloring, flood fill, blur, SHA-256 and sorting.
version: 0.1.0
homepage: https://github.com/winterzxzz/flutter_rust
repository: https://github.com/winterzxzz/flutter_rust/tree/main/packages/fast_rust
issue_tracker: https://github.com/winterzxzz/flutter_rust/issues
topics:
  - ffi
  - rust
  - performance
  - image-processing
  - native-assets

screenshots:
  - description: Recoloring a real photo in Flutter with Rust, texture kept
    path: doc/screenshots/photo.png
  - description: Pixel-art coloring book with a Rust flood fill
    path: doc/screenshots/paint.png
  - description: Mandelbrot explorer rendered by multi-threaded Rust
    path: doc/screenshots/fractal.png
  - description: Real-time box blur on the UI thread
    path: doc/screenshots/blur.png

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.2.0

dev_dependencies:
  crypto: ^3.0.6
  lints: ^6.0.0
  test: ^1.25.0
