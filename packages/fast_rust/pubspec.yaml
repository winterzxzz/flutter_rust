name: fast_rust
description: >-
  Rust-powered performance for Flutter and Dart: zero-copy dart:ffi calls,
  native-assets build hook, parallel image processing, SHA-256, sorting.
version: 0.1.0
publish_to: none
topics:
  - ffi
  - rust
  - performance
  - image-processing
  - native-assets

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.2.0

dev_dependencies:
  crypto: ^3.0.6
  lints: ^6.0.0
  test: ^1.25.0
